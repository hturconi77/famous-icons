<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Famous Reservations</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Famous RES">

  <link rel="manifest" href="reservations-manifest-clean.json">
  <link rel="icon" type="image/png" href="RESicon.png">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
      color: #333;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 390px);
      text-align: center;
    }

    .flag {
      width: 100%;
      margin-bottom: 24px;
    }

    .blue {
      height: 3px;
      background: #0057b7;
    }

    .yellow {
      height: 3px;
      background: #ffd700;
    }

    .icon {
      width: 112px;
      height: 112px;
      border-radius: 24px;
      display: block;
      margin: 0 auto 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    p {
      margin: 0 0 22px;
      font-size: 14px;
      line-height: 1.45;
      color: #777;
    }

    a {
      display: inline-block;
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #222;
      border-radius: 12px;
      color: #222;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
  </style>

  <script>
    (function () {
      var standalone =
        window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;

      if (standalone) {
        window.location.replace("https://script.google.com/macros/s/AKfycbwWC0nDyuQ3G6jQ20btAcnRoIEgsnKwwNF5FMUSVRvMX9Rk-PCNyRu-HUBwXBpLhkM6lw/exec");
      }
    })();
  </script>
</head>

<body>
  <main class="card">
    <div class="flag">
      <div class="blue"></div>
      <div class="yellow"></div>
    </div>

    <img class="icon" src="RESicon.png" alt="Famous RES">

    <h1>Famous Reservations</h1>
    <p>
      Añade esta página a la pantalla de inicio del iPhone.
      Al abrirla desde el icono, entrará directamente en Famous Reservations.
    </p>

    <a href="https://script.google.com/macros/s/AKfycbwWC0nDyuQ3G6jQ20btAcnRoIEgsnKwwNF5FMUSVRvMX9Rk-PCNyRu-HUBwXBpLhkM6lw/exec">
      ABRIR RESERVATIONS
